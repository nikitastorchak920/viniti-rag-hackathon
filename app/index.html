<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG: просмотр извлечённых данных</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}
header{padding:10px 16px;background:#1f3a5f;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
main{padding:12px 16px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input,select,button{padding:5px 8px;font:inherit}
table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #d5d9de;padding:3px 6px;text-align:left;vertical-align:top;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{background:#eef1f5;position:sticky;top:0}tr.r:hover{background:#eef6ff;cursor:pointer}
#detail{background:#fff;border:1px solid #9db4d3;padding:8px 12px;margin:8px 0;white-space:pre-wrap;display:none}
.tabs button.on{background:#1f3a5f;color:#fff}.muted{color:#667}.wrap{max-height:62vh;overflow:auto}
</style></head><body>
<header><b>RAG viewer</b><label>Папка с CSV (out_dev): <input id="files" type="file" webkitdirectory multiple></label><span id="stat" class="muted" style="color:#cfe"></span></header>
<main>
<div class="tabs bar" id="tabs"></div>
<div class="bar"><input id="q" placeholder="поиск по всем полям" size="30">
<select id="fpub"><option value="">все публикации</option></select>
<select id="fmetric"><option value="">все метрики</option></select>
<select id="fdata"><option value="">все датасеты</option></select>
<select id="forig"><option value="">primary+cited</option><option>primary</option><option>cited</option></select>
<select id="fstat"><option value="">любой статус</option><option>extracted</option><option>present_not_extractable</option><option>absent</option></select>
<span id="cnt" class="muted"></span></div>
<div id="detail"></div><div class="wrap"><table id="t"></table></div>
</main>
<script>
const T=["publications","configurations","datasets","tasks","experiments","results","issues"];
const D={};let cur="results";
function parse(s){const rows=[];let r=[],f="",q=false;s=s.replace(/^﻿/,"");
for(let i=0;i<s.length;i++){const c=s[i];
 if(q){if(c=='"'){if(s[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=""}
 else if(c=='\n'||c=='\r'){if(c=='\r'&&s[i+1]=='\n')i++;r.push(f);f="";rows.push(r);r=[]}else f+=c}
if(f||r.length){r.push(f);rows.push(r)}
const h=rows.shift()||[];return rows.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||""])))}
document.getElementById("files").onchange=async e=>{
 for(const f of e.target.files){const n=f.name.replace(/\.csv$/,"");if(T.includes(n)&&f.name.endsWith(".csv"))D[n]=parse(await f.text())}
 init()};
function uniq(rows,k){return [...new Set(rows.map(r=>r[k]).filter(Boolean))].sort()}
function fill(id,vals,all){const s=document.getElementById(id);s.innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join("")}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function init(){
 document.getElementById("stat").textContent=T.map(t=>t+":"+(D[t]||[]).length).join(" ");
 const R=D.results||[];
 fill("fpub",uniq(D.publications||[],"publication_id"),"все публикации");
 fill("fmetric",uniq(R,"metric_name"),"все метрики");fill("fdata",uniq(D.datasets||[],"dataset_name"),"все датасеты");
 document.getElementById("tabs").innerHTML=T.map(t=>`<button data-t="${t}" class="${t==cur?"on":""}">${t}</button>`).join("");
 document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{cur=b.dataset.t;init()});
 render()}
["q","fpub","fmetric","fdata","forig","fstat"].forEach(id=>document.getElementById(id).oninput=render);
function render(){
 const rows=D[cur]||[],v=id=>document.getElementById(id).value,q=v("q").toLowerCase();
 const dsn={};(D.datasets||[]).forEach(d=>dsn[d.publication_id+"|"+d.dataset_id]=d.dataset_name);
 const out=rows.filter(r=>(!v("fpub")||r.publication_id==v("fpub"))&&
  (cur!="results"||((!v("fmetric")||r.metric_name==v("fmetric"))&&(!v("fdata")||dsn[r.publication_id+"|"+r.dataset_id]==v("fdata"))&&
   (!v("forig")||r.result_origin==v("forig"))&&(!v("fstat")||r.extraction_status==v("fstat"))))&&
  (!q||Object.values(r).some(x=>x.toLowerCase().includes(q)))).slice(0,3000);
 document.getElementById("cnt").textContent=out.length+" строк (показано до 3000)";
 const cols=rows.length?Object.keys(rows[0]):[];const t=document.getElementById("t");
 t.innerHTML="<tr>"+cols.map(c=>`<th>${c}</th>`).join("")+"</tr>"+out.map((r,i)=>`<tr class="r" data-i="${i}">`+cols.map(c=>`<td title="${esc(r[c])}">${esc(r[c])}</td>`).join("")+"</tr>").join("");
 t.querySelectorAll("tr.r").forEach(tr=>tr.onclick=()=>{const r=out[tr.dataset.i],d=document.getElementById("detail");d.style.display="block";
  d.textContent=Object.entries(r).filter(e=>e[1]).map(e=>e[0]+": "+e[1]).join("\n")+(cur=="results"?"\n\n→ Источник: PDF "+r.publication_id+".pdf, страница "+r.source_page+" (с 1)":"")})}
</script></body></html>
